[project]
name = "atreides-vision"
version = "0.1.0"
description = "Atreides Vision V0.1 — SEE + TRACK. Local MP4 person detection and tracking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "rfdetr>=1.2",
    "trackers>=2.0",
]

[project.scripts]
atreides-vision = "atreides_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atreides_vision"]
